
import os
import time
import requests
from concurrent.futures import ThreadPoolExecutor, as_completed

# ==========================================================
# BITGET DAILY + WEEKLY DEMAND RADAR
# Tüm Bitget USDT-M perpetual futures sözleşmeleri
# Günlük + haftalık demand bölgesi taraması
# Telegram bildirimi
# ==========================================================

BASE_URL = "https://api.bitget.com"
PRODUCT_TYPE = "USDT-FUTURES"

BOT_TOKEN = os.getenv("BOT_TOKEN", "").strip()
CHAT_ID = os.getenv("CHAT_ID", "").strip()

MAX_WORKERS = 8
CANDLE_LIMIT = 100
DAILY_NEAR_PERCENT = 5.0
WEEKLY_NEAR_PERCENT = 10.0
MAX_TELEGRAM_LENGTH = 3500
REQUEST_TIMEOUT = 15

session = requests.Session()
session.headers.update({"User-Agent": "Bitget-Demand-Radar/1.0"})


def api_get(path, params=None):
    """Bitget public API isteği."""
    response = session.get(
        BASE_URL + path,
        params=params,
        timeout=REQUEST_TIMEOUT
    )
    response.raise_for_status()
    result = response.json()

    if result.get("code") != "00000":
        raise RuntimeError(
            f"Bitget API hatası: {result.get('code')} "
            f"{result.get('msg')}"
        )

    return result.get("data", [])


def get_contracts():
    """Aktif USDT vadeli sözleşmeleri getir."""
    data = api_get(
        "/api/v2/mix/market/contracts",
        {"productType": PRODUCT_TYPE}
    )

    symbols = []

    for item in data:
        symbol = item.get("symbol", "")
        status = str(item.get("symbolStatus", "")).lower()
        symbol_type = str(item.get("symbolType", "")).lower()

        if not symbol.endswith("USDT"):
            continue

        if status != "normal":
            continue

        # Teslim tarihli sözleşmeleri dışarıda bırak.
        if symbol_type and symbol_type != "perpetual":
            continue

        symbols.append(symbol)

    return sorted(set(symbols))


def get_tickers():
    """Tüm sözleşmelerin güncel fiyatlarını getir."""
    data = api_get(
        "/api/v2/mix/market/tickers",
        {"productType": PRODUCT_TYPE}
    )

    prices = {}

    for item in data:
        symbol = item.get("symbol")
        try:
            price = float(item.get("lastPr", 0))
            if symbol and price > 0:
                prices[symbol] = price
        except (TypeError, ValueError):
            continue

    return prices


def get_candles(symbol, timeframe):
    """Günlük veya haftalık mumları getir."""
    data = api_get(
        "/api/v2/mix/market/candles",
        {
            "symbol": symbol,
            "productType": PRODUCT_TYPE,
            "granularity": timeframe,
            "limit": str(CANDLE_LIMIT)
        }
    )

    candles = []

    for row in data:
        if len(row) < 5:
            continue

        try:
            candles.append({
                "time": int(row[0]),
                "open": float(row[1]),
                "high": float(row[2]),
                "low": float(row[3]),
                "close": float(row[4])
            })
        except (TypeError, ValueError):
            continue

    candles.sort(key=lambda candle: candle["time"])

    # Son mum henüz kapanmamış olabilir.
    # Demand tespitinde yalnızca kapanmış mumları kullan.
    if len(candles) >= 2:
        candles = candles[:-1]

    return candles


def calculate_atr(candles, period=14):
    """Basit ATR hesaplaması."""
    if len(candles) < period + 1:
        return None

    ranges = []

    for i in range(1, len(candles)):
        current = candles[i]
        previous = candles[i - 1]

        true_range = max(
            current["high"] - current["low"],
            abs(current["high"] - previous["close"]),
            abs(current["low"] - previous["close"])
        )
        ranges.append(true_range)

    recent = ranges[-period:]

    if not recent:
        return None

    return sum(recent) / len(recent)


def find_demand_zone(candles):
    """
    Yakın geçmişteki son demand bölgesini ara.

    Kural:
    - Küçük gövdeli veya düşüş mumu olan bir baz.
    - Ardından 1-3 mum içinde yukarı yönlü hareket.
    - Yükseliş kapanışı bazın tepesini aşmalı.
    - Hareket en az yaklaşık 1.5 ATR olmalı.

    Bölge: baz mumunun düşük ve yüksek fiyatı.
    Bu, otomatik bir teknik yaklaşımdır; kesin destek değildir.
    """
    if len(candles) < 25:
        return None

    atr = calculate_atr(candles)

    if atr is None or atr <= 0:
        return None

    # En yeni geçerli bölgeyi bulmak için sondan geriye git.
    # Son 3 mumluk hareketi de değerlendirebilmek için sınır koy.
    start = max(0, len(candles) - 60)

    for i in range(len(candles) - 4, start - 1, -1):
        base = candles[i]

        base_range = base["high"] - base["low"]
        if base_range <= 0:
            continue

        body_ratio = abs(base["close"] - base["open"]) / base_range
        is_base = (
            base["close"] <= base["open"]
            or body_ratio <= 0.45
        )

        if not is_base:
            continue

        future = candles[i + 1:i + 4]

        if not future:
            continue

        highest_close = max(c["close"] for c in future)
        highest_high = max(c["high"] for c in future)

        bullish_displacement = (
            highest_close > base["high"]
            and highest_close - base["low"] >= 1.5 * atr
            and highest_high > base["high"]
        )

        if not bullish_displacement:
            continue

        return {
            "low": base["low"],
            "high": base["high"],
            "base_time": base["time"],
            "atr": atr
        }

    return None


def assess_zone(price, zone, near_percent):
    """Fiyatın demand bölgesine göre konumu."""
    if zone is None:
        return None

    low = zone["low"]
    high = zone["high"]

    if low <= price <= high:
        status = "BÖLGE İÇİNDE"
        distance = 0.0

    elif price > high:
        distance = (price - high) / high * 100

        if distance <= near_percent:
            status = "YAKLAŞIYOR"
        else:
            return None

    else:
        # Bölgenin altında fiyat var; kırılmış/bozulmuş olabilir.
        # LONG adayı olarak listeleme.
        return None

    return {
        **zone,
        "status": status,
        "distance": distance
    }


def scan_symbol(symbol, price):
    """Bir coin için günlük ve haftalık demand tara."""
    result = {
        "symbol": symbol,
        "price": price,
        "daily": None,
        "weekly": None
    }

    try:
        daily_candles = get_candles(symbol, "1D")
        daily_zone = find_demand_zone(daily_candles)

        if daily_zone:
            result["daily"] = assess_zone(
                price, daily_zone, DAILY_NEAR_PERCENT
            )

        # İstek aralarında küçük bekleme.
        time.sleep(0.08)

        weekly_candles = get_candles(symbol, "1W")
        weekly_zone = find_demand_zone(weekly_candles)

        if weekly_zone:
            result["weekly"] = assess_zone(
                price, weekly_zone, WEEKLY_NEAR_PERCENT
            )

        return result

    except Exception as exc:
        return {
            "symbol": symbol,
            "price": price,
            "daily": None,
            "weekly": None,
            "error": str(exc)[:160]
        }


def fmt_price(value):
    if value is None:
        return "-"
    if value >= 100:
        return f"{value:.4f}".rstrip("0").rstrip(".")
    if value >= 1:
        return f"{value:.6f}".rstrip("0").rstrip(".")
    return f"{value:.10f}".rstrip("0").rstrip(".")


def format_zone(label, zone):
    if zone is None:
        return f"{label}: uygun bölge bulunamadı"

    return (
        f"{label}: {zone['status']} | "
        f"{fmt_price(zone['low'])} - {fmt_price(zone['high'])} | "
        f"uzaklık %{zone['distance']:.2f}"
    )


def build_messages(results, scanned_count, error_count):
    """Telegram mesajlarını oluştur."""
    matches = [
        item for item in results
        if item.get("daily") or item.get("weekly")
    ]

    # İki zaman dilimi de eşleşen coinleri önce göster.
    matches.sort(
        key=lambda item: (
            -(int(item["daily"] is not None)
              + int(item["weekly"] is not None)),
            min(
                item["daily"]["distance"] if item["daily"] else 999,
                item["weekly"]["distance"] if item["weekly"] else 999
            )
        )
    )

    header = (
        "🔎 BITGET DEMAND RADARI\n"
        "USDT-M PERPETUAL | 1D + 1W\n"
        f"Taranan sözleşme: {scanned_count}\n"
        f"Eşleşen coin: {len(matches)}\n"
        f"Tarama hatası: {error_count}\n"
        "Bölgeler kapanmış mumlardan hesaplanmıştır.\n"
        "────────────────────\n"
    )

    if not matches:
        return [header + "\nŞu an filtreye uyan demand bölgesi bulunamadı."]

    messages = []
    current = header
    count = 0

    for item in matches:
        count += 1

        text_block = (
            f"\n#{count} {item['symbol']}\n"
            f"Fiyat: {fmt_price(item['price'])}\n"
            f"{format_zone('GÜNLÜK', item['daily'])}\n"
            f"{format_zone('HAFTALIK', item['weekly'])}\n"
            "────────────────────\n"
        )

        if len(current) + len(text_block) > MAX_TELEGRAM_LENGTH:
            messages.append(current)
            current = "BITGET DEMAND RADARI — DEVAM\n"

        current += text_block

    if current:
        messages.append(current)

    return messages


def send_telegram(message):
    """Telegram'a mesaj gönder."""
    if not BOT_TOKEN or not CHAT_ID:
        print("Telegram ayarları eksik; sonuçlar konsola yazılacak.")
        print(message)
        return

    response = requests.post(
        f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage",
        json={
            "chat_id": CHAT_ID,
            "text": message,
            "disable_web_page_preview": True
        },
        timeout=20
    )
    response.raise_for_status()

    data = response.json()
    if not data.get("ok"):
        raise RuntimeError(f"Telegram hatası: {data}")


def main():
    print("Bitget sözleşmeleri alınıyor...")
    symbols = get_contracts()

    print("Canlı fiyatlar alınıyor...")
    prices = get_tickers()

    symbols = [s for s in symbols if s in prices]

    print(f"Tarama başladı: {len(symbols)} sözleşme")

    results = []
    errors = 0

    with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
        futures = {
            executor.submit(scan_symbol, symbol, prices[symbol]): symbol
            for symbol in symbols
        }

        for future in as_completed(futures):
            try:
                item = future.result()
                results.append(item)

                if item.get("error"):
                    errors += 1

                if len(results) % 25 == 0:
                    print(f"İlerleme: {len(results)}/{len(symbols)}")

            except Exception as exc:
                errors += 1
                print(f"Hata: {futures[future]}: {exc}")

    messages = build_messages(results, len(symbols), errors)

    for message in messages:
        send_telegram(message)
        time.sleep(1)

    print("Tarama tamamlandı.")


if __name__ == "__main__":
    try:
        main()
    except Exception as exc:
        print(f"RADAR ÇALIŞMA HATASI: {exc}")
        raise
