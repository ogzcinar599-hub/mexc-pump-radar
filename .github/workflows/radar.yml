name: MEXC Pump Radar

on:

  # GitHub'dan elle çalıştır
  workflow_dispatch:

  # Her 10 dakikada bir çalıştır
  schedule:

    - cron: "*/10 * * * *"


jobs:

  radar:

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      # ======================================================
      # REPOSITORY
      # ======================================================

      - name: Repository indir

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Python kurulumu

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # PAKETLER
      # ======================================================

      - name: Paketleri kur

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi


      # ======================================================
      # RADAR
      # ======================================================

      - name: Radar çalıştır

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python main.py


      # ======================================================
      # SONUÇ
      # ======================================================

      - name: Tamamlandı

        if: success()

        run: |

          echo "========================================="

          echo "🚀 MEXC PUMP RADAR TAMAMLANDI"

          echo "========================================="
